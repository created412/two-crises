<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선생님 화면 · 두 번의 위기</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe4;--sheet:#fffdf7;--ink:#16130f;--ink2:#4a4339;--rule:#cfc4ae;--red:#d6281b;--board:#0f1411;--led:#ffb020;--ok:#1f7a4d;--display:'Black Han Sans',sans-serif;--body:'IBM Plex Sans KR',sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}body{margin:0;font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55}
header{background:var(--board);color:var(--paper);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.code{font-family:var(--mono);font-size:44px;color:var(--led);letter-spacing:.12em}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--sheet);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px 22px;margin-bottom:20px}
h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 10px}h3{font-family:var(--display);font-weight:400;font-size:20px;margin:16px 0 8px}
button{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 20px;cursor:pointer;box-shadow:4px 4px 0 var(--red);font-size:17px}
button.ghost{background:var(--sheet);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
input{font:inherit;border:1.5px solid var(--ink);padding:9px 10px;width:220px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2);font-size:14px}.err{color:var(--red);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}th,td{border:1px solid var(--ink);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--ink);color:var(--paper);font-weight:500}
td.n{text-align:right;font-family:var(--mono)}.y{color:var(--ok);font-weight:700}.no{color:var(--red)}
.status{display:flex;gap:24px;flex-wrap:wrap;font-size:18px;margin-bottom:12px}.status b{font-family:var(--mono)}
.ph{padding:3px 12px;border:2px solid var(--ink);font-weight:700}.ph.open{background:var(--red);color:#fff;border-color:var(--red)}.ph.closed{background:var(--led)}
.tabs{display:flex;gap:0;margin-bottom:16px}.tabs button{box-shadow:none;background:var(--sheet);color:var(--ink)}.tabs button.on{background:var(--ink);color:var(--paper)}
details{border-top:1px solid var(--rule);padding:8px 0}summary{cursor:pointer;font-weight:700}
.rep p{margin:4px 0 10px}.rep h4{margin:12px 0 4px}
a{color:#1d4ed8}
.chart{width:100%;height:auto;background:#fff;border:2px solid var(--ink)}

.stage{display:grid;grid-template-columns:240px 1fr 230px;gap:24px;align-items:center;background:var(--board);color:var(--paper);padding:22px 26px;border:2px solid var(--ink);margin-bottom:14px}
.stage .rd{white-space:nowrap;font-family:var(--display);font-size:40px;color:var(--led);line-height:1}.stage .rd small{font-size:20px;color:#b9b2a2}
.stage .ph{display:inline-block;margin-top:10px;padding:3px 12px;border:1px solid #556;font-weight:700}.stage .ph.open{background:var(--red);border-color:var(--red)}.stage .ph.closed{background:var(--led);color:var(--ink)}
.stage .evd{font-family:var(--mono);color:#ff7a6e;font-size:22px;font-weight:700}.stage .evt{font-family:var(--display);font-size:46px;line-height:1.1;margin-top:4px}
.stage.ready .evt{color:#8d877a}
.tnews{margin:12px 0 0;padding-left:20px;font-size:19px;line-height:1.55;color:#e8e1d2}
.stage .sr{text-align:right}.tm{font-family:var(--mono);font-size:64px;font-weight:700;line-height:1}.tm.low{color:#ff5a4e;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tbar{display:block;height:10px;background:#2a302b;margin:10px 0}.tbar u{display:block;height:100%;background:var(--led);transition:width .5s linear}
.stage .sub{font-size:22px}.stage .sub b{font-family:var(--mono);color:var(--led);font-size:34px}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.ctl .lim{font-weight:700}.ctl select{font:inherit;padding:8px;border:1.5px solid var(--ink)}
.peek{font-size:14px;background:#fff4d6;border:1px dashed #b7791f;padding:6px 10px}
.board{background:var(--board);color:var(--led);display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink)}
.tile{padding:16px 18px;border-right:1px solid #2a302b;text-align:left}.tile:last-child{border-right:0}
.tile img{width:100%;height:110px;object-fit:cover;display:block;margin-bottom:10px;opacity:.9}
.tile .nm{color:#f4efe4;font-weight:700}.price{font-family:var(--mono);font-weight:700;font-size:56px;line-height:1.05;color:var(--led)}
.chg{font-family:var(--mono);font-size:22px;font-weight:700;color:#b9b2a2}.chg.up{color:#53d18f}.chg.down{color:#ff5a4e}
.tile.fu{animation:flashU 1.6s ease-out .3s}.tile.fd{animation:flashD 1.6s ease-out .3s}
@keyframes flashU{0%,100%{background:transparent}25%{background:rgba(83,209,143,.28)}}@keyframes flashD{0%,100%{background:transparent}25%{background:rgba(255,90,78,.3)}}
.bars{margin:8px 0}.bh,.br{display:grid;grid-template-columns:170px 1fr 1fr 260px;gap:16px;align-items:center}
.bh{font-size:14px;color:var(--ink2);padding-bottom:4px;border-bottom:2px solid var(--ink)}.br{padding:12px 0;border-bottom:1px solid var(--rule)}.br b{font-size:17px}
.bw{position:relative;height:32px;background:linear-gradient(90deg,transparent calc(50% - 1px),#16130f calc(50% - 1px),#16130f calc(50% + 1px),transparent calc(50% + 1px)),#f1ebdf}
.bw .b{position:absolute;top:5px;height:22px;width:0;animation:grow .9s ease-out .4s forwards}.bw .b.p{left:50%}.bw .b.n{right:50%}
@keyframes grow{to{width:var(--w)}}.bw em{position:absolute;top:6px;left:6px;font-style:normal;font-family:var(--mono);font-size:14px;font-weight:700}
.br strong{font-family:var(--mono);font-size:26px}.br strong.up{color:var(--ok)}.br strong.down{color:var(--red)}.br strong small{display:block;font-size:13px;color:var(--ink2);font-weight:400}
.chart.draw .ln[pathLength]{stroke-dasharray:1 1;stroke-dashoffset:1;animation:drawLn 2.2s ease-in-out forwards}.chart.draw .ln[stroke-dasharray="10 6"]{animation:fadeIn 1.6s ease-out both}
@keyframes drawLn{to{stroke-dashoffset:0}}.chart.draw .dt,.chart.draw .lb{opacity:0;animation:fadeIn .5s ease-out forwards}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
details.card summary{cursor:pointer;font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.bw .b{width:var(--w)}.chart.draw .dt,.chart.draw .lb{opacity:1}}
</style>
</head>
<body>
<header><h1>선생님 화면 · 두 번의 위기</h1><div class="row"><span>방 코드</span><span class="code" id="code">----</span></div></header>
<main id="app"></main>
<script>
'use strict';
const API='https://two-crises-api.histo5731.workers.dev/api';
const SITE='https://created412.github.io/two-crises/game.html';
const CO=['A 한빛수출','B 바다유통','C 튼튼건설','D 믿음은행'];
let T=JSON.parse(localStorage.getItem('twoCrisisTeacher')||'{}');let D=null;let tab='game';
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:1});
async function api(p,b){const r=await fetch(API+p,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
function saveT(){localStorage.setItem('twoCrisisTeacher',JSON.stringify(T))}

function setup(){$('#app').innerHTML=`<div class="card"><h2>새 방 만들기</h2><p>수업 시작 전에 한 번 만듭니다. 비밀번호는 이 화면을 다시 열 때 필요합니다.</p>
<div class="row"><input id="pin" type="password" placeholder="선생님 비밀번호 (4자 이상)"><button id="mk">방 만들기</button></div>
<h3>이미 만든 방 다시 열기</h3><div class="row"><input id="oc" placeholder="방 코드"><input id="op" type="password" placeholder="비밀번호"><button class="ghost" id="op2">열기</button></div><div id="msg"></div></div>`;
 $('#mk').onclick=async()=>{try{const pin=$('#pin').value.trim();const j=await api('/rooms',{pin});T={code:j.code,pin};saveT();start()}catch(e){$('#msg').innerHTML=`<p class="err">${esc(e.message)}</p>`}};
 $('#op2').onclick=async()=>{T={code:$('#oc').value.trim(),pin:$('#op').value.trim()};try{await api(`/rooms/${T.code}/teacher?pin=${encodeURIComponent(T.pin)}`);saveT();start()}catch(e){$('#msg').innerHTML=`<p class="err">${esc(e.message)}</p>`}}}

const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;const pct=x=>(x>0?'+':'')+fmt(x)+'%';
const COI=['img/co_a.webp','img/co_b.webp','img/co_c.webp','img/co_d.webp'];
let clockOff=0,lastKey='',LIMIT=+(localStorage.getItem('tcLimit')||240);
function chart(g){const st=D.state;const R=st.real?.[g];const h=st.history[g];if(!R||!h.length)return '';
 const months=R.kospi.map(r=>r[0]);const mi=d=>months.indexOf(d);
 const norm=s=>{const base=(s.find(r=>r[0]===h[0].date)||s[0])[1];return s.map(([d,v])=>[mi(d),v/base*100])};
 const series=[{n:'실제 코스피',c:'#16130f',w:4,pts:norm(R.kospi)}];if(R.sp500)series.push({n:'실제 S&P 500',c:'#1d4ed8',w:3,pts:norm(R.sp500)});
 series.push({n:'우리 반',c:'#d6281b',w:4,d:'10 6',pts:h.map(x=>[mi(x.date),avg(x.after)]),dots:true});
 const all=series.flatMap(s=>s.pts.map(p=>p[1])).concat(100);const lo=Math.floor(Math.min(...all)/10)*10-5,hi=Math.ceil(Math.max(...all)/10)*10+5;
 const W=1000,H=430,L=56,Rr=160,T=24,B=58;const X=i=>L+(W-L-Rr)*i/(months.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 let s=`<svg class="chart draw" viewBox="0 0 ${W} ${H}">`;for(let v=Math.ceil(lo/20)*20;v<=hi;v+=20)s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e4dbc8"/><text x="${L-8}" y="${Y(v)+4}" font-size="13" text-anchor="end">${v}</text>`;
 s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(100)}" y2="${Y(100)}" stroke="#16130f" stroke-dasharray="3 4"/>`;
 months.forEach((m,i)=>{if(i%3===0)s+=`<text x="${X(i)}" y="${H-B+20}" font-size="12" text-anchor="middle">${m.replace('-','.')}</text>`});
 h.forEach((x,k)=>{const i=mi(x.date);s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${H-B}" stroke="#d6281b" stroke-opacity=".18"/><text x="${X(i)}" y="${H-B+40}" font-size="13" font-weight="700" text-anchor="middle" fill="#d6281b">R${k+1}</text>`});
 series.forEach((se,k)=>{const pts=se.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');const last=se.pts.at(-1);
  s+=`<polyline class="ln" style="animation-delay:${k*.6}s" ${se.d?`stroke-dasharray="${se.d}"`:'pathLength="1"'} fill="none" stroke="${se.c}" stroke-width="${se.w}" stroke-linejoin="round" points="${pts}"/>`;
  if(se.dots)se.pts.forEach(p=>s+=`<circle class="dt" style="animation-delay:${k*.6+.9}s" cx="${X(p[0])}" cy="${Y(p[1])}" r="5" fill="${se.c}"/>`);
  s+=`<text class="lb" style="animation-delay:${k*.6+1}s" x="${X(last[0])+8}" y="${Y(last[1])+5}" font-size="15" font-weight="700" fill="${se.c}">${se.n.replace('실제 ','')} ${Math.round(last[1])}</text>`});
 return s+'</svg><p class="muted">세 선 모두 R1 시점=100. 코스피 ^KS11 · S&P 500 ^GSPC 월말 종가(Yahoo Finance)</p>'}
function bars(x){const mx=30;const bar=(v,c)=>{const w=Math.min(Math.abs(v),mx)/mx*50;return `<div class="bw"><span class="b ${v>=0?'p':'n'}" style="--w:${w}%;background:${c}"></span><em>${pct(v)}</em></div>`};
 return `<div class="bars"><div class="bh"><span></span><span>사건 영향</span><span>우리 반 매수·매도</span><span>최종 변화</span></div>${CO.map((c,i)=>{const tot=(x.after[i]/x.before[i]-1)*100;return `<div class="br"><b>${c}</b>${bar(x.e[i],x.e[i]>=0?'#2fa86b':'#d6281b')}${bar(x.d[i],x.d[i]>=0?'#53d18f':'#ff7a6e')}<strong class="${tot>=0?'up':'down'}">${tot>=0?'▲':'▼'} ${pct(tot)}<small>${fmt(x.before[i])} → ${fmt(x.after[i])} · 산 ${x.buyers[i]} / 판 ${x.sellers[i]}</small></strong></div>`}).join('')}</div>`}
function board(p,prev){return `<div class="board">${CO.map((c,i)=>{const ch=prev?(p[i]/prev[i]-1)*100:0;return `<div class="tile ${prev?(ch>=0?'fu':'fd'):''}"><img src="${COI[i]}" alt=""><div class="nm">${c}</div><div class="price" data-from="${prev?prev[i]:p[i]}" data-to="${p[i]}">${fmt(prev?prev[i]:p[i])}</div>${prev?`<div class="chg ${ch>=0?'up':'down'}">${ch>=0?'▲ +':'▼ '}${fmt(ch)}%</div>`:'<div class="chg">만원</div>'}</div>`}).join('')}</div>`}
function countUp(){document.querySelectorAll('.price[data-from]').forEach(el=>{const a=+el.dataset.from,b=+el.dataset.to;if(a===b){el.textContent=fmt(b);return}const t0=performance.now(),Dd=1500;const step=t=>{const k=Math.min(1,(t-t0)/Dd),e=1-Math.pow(1-k,3);el.textContent=fmt(a+(b-a)*e);if(k<1)requestAnimationFrame(step)};setTimeout(()=>requestAnimationFrame(step),350)})}
function tick(){const st=D?.state;const el=document.getElementById('tm');if(!el||!st||st.phase!=='open'||!st.openedAt)return;const left=Math.max(0,st.limit*1000-((Date.now()+clockOff)-st.openedAt));const s=Math.ceil(left/1000);el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;el.classList.toggle('low',s<=30);const b=document.getElementById('tmbar');if(b)b.style.width=(left/(st.limit*1000)*100)+'%'}
setInterval(tick,500);
async function act(a){if(a==='close'&&!confirm('이번 라운드를 마감하고 주가를 반영할까요?'))return;try{await api(`/rooms/${T.code}/teacher`,{pin:T.pin,action:a,limit:LIMIT});lastKey='';await load()}catch(e){alert(e.message)}}
async function load(){try{const t0=Date.now();D=await api(`/rooms/${T.code}/teacher?pin=${encodeURIComponent(T.pin)}`);clockOff=D.state.now-Math.round((t0+Date.now())/2);
 const st=D.state;const ordN=D.orders.filter(o=>o.game===st.game&&o.round===st.round).length;const key=[tab,st.game,st.round,st.phase,st.history[st.game].length,st.limit,D.submissions.length,D.players.length].join('|');
 if(key!==lastKey){lastKey=key;draw()}else{const c=document.getElementById('cnt');if(c)c.textContent=`${ordN}/${D.players.length}`;document.querySelectorAll('[data-pl]').forEach(td=>{const on=D.orders.some(o=>o.player===td.dataset.pl&&o.game===st.game&&o.round===st.round);td.className=on?'y':'no';td.textContent=on?'제출':'-'})}
}catch(e){$('#app').innerHTML=`<div class="card"><p class="err">${esc(e.message)}</p><button id="re">다른 방 열기</button></div>`;$('#re').onclick=()=>{T={};saveT();setup()}}}

function gameTab(){const st=D.state,g=st.game,p=st.prices[g],h=st.history[g];const ordN=D.orders.filter(o=>o.game===g&&o.round===st.round).length;
 const evIdx=st.phase==='over'?-1:st.round;const ev=D.effects[evIdx];const pubEv=st.events[g].at(-1);const rn=Math.min(st.round+1,6);
 const title=st.phase==='ready'?(ev?ev.title:''):(st.phase==='over'?(g==='97'?'1997 게임 끝 · 실제와 비교':'2008 게임 끝 · 실제와 비교'):pubEv?.title||'');
 let top=`<div class="stage ${st.phase}"><div class="sl"><div class="rd">${g==='97'?'1997':'2008'} · R${rn}<small>/6</small></div><div class="ph ${st.phase}">${{ready:'다음 라운드 대기',open:'주문 받는 중',closed:'라운드 결과',over:'게임 종료'}[st.phase]}</div></div>
  <div class="sm"><div class="evd">${st.phase==='ready'?'다음 사건 (아직 비공개)':esc((pubEv?.date||'').replace('-','.'))}</div><div class="evt">${esc(title.split('·').slice(st.phase==='over'?0:1).join('·').trim()||title)}</div>${st.phase==='open'?`<ul class="tnews">${pubEv.news.map(n=>`<li>${n}</li>`).join('')}</ul>`:''}</div>
  <div class="sr">${st.phase==='open'?`<div id="tm" class="tm">--:--</div><i class="tbar"><u id="tmbar"></u></i><div class="sub">제출 <b id="cnt">${ordN}/${D.players.length}</b></div>`:`<div class="sub">입장 <b>${D.players.length}</b>명</div>`}</div></div>`;
 let ctl=`<div class="ctl">
  <button onclick="act('open')" ${st.phase==='ready'?'':'disabled'}>① 라운드 열기</button>
  <button onclick="act('close')" ${st.phase==='open'?'':'disabled'}>② 마감하고 주가 반영</button>
  <button onclick="act('next')" ${st.phase==='closed'?'':'disabled'}>③ ${st.round>=5?'게임 끝내고 실제와 비교':'다음 라운드로'}</button>
  ${g==='97'&&st.phase==='over'?`<button onclick="act('start08')">2008 게임 시작</button>`:''}
  ${st.phase==='open'?`<button class="ghost" onclick="act('extend')">+1분</button><button class="ghost" onclick="act('undoOpen')">열기 취소</button>`:''}
  <label class="lim">주문 시간 <select onchange="LIMIT=+this.value;localStorage.setItem('tcLimit',LIMIT)">${[180,240,300].map(v=>`<option value="${v}" ${v===LIMIT?'selected':''}>${v/60}분</option>`).join('')}</select></label>
  ${st.phase==='ready'&&ev?`<span class="peek">선생님만 보임 · 사건 영향 ${ev.e.map((x,i)=>CO[i].slice(0,1)+' '+(x>0?'+':'')+x+'%').join(' · ')}</span>`:''}</div>`;
 let body='';
 if(st.phase==='over')body+=`<div class="card">${chart(g)}</div>`;
 else body+=`<div class="card">${board(p,st.phase==='closed'?h.at(-1)?.before:null)}${st.phase==='closed'&&h.length?`<h3>왜 바뀌었나</h3>${bars(h.at(-1))}`:''}</div>`;
 body+=`<details class="card"><summary>학생 ${D.players.length}명 · 주문 현황</summary><table><tr><th>학번 이름</th><th>이번 라운드</th><th>1997 평가액</th><th>2008 평가액</th><th>보고서</th></tr>
 ${D.players.map(pl=>{const w=gg=>{const G=pl.games[gg];return G.cash+G.q.reduce((s,q,i)=>s+q*D.state.prices[gg][i],0)};const on=D.orders.some(o=>o.player===pl.id&&o.game===g&&o.round===st.round);const sub=D.submissions.find(s=>s.player===pl.id);return `<tr><td>${esc(pl.name)}</td><td data-pl="${pl.id}" class="${on?'y':'no'}">${on?'제출':'-'}</td><td class="n">${fmt(w('97'))}</td><td class="n">${fmt(w('08'))}</td><td>${sub?'<span class="y">'+new Date(sub.ts).toLocaleTimeString('ko-KR')+'</span>':'-'}</td></tr>`}).join('')}</table>
 <p class="muted">학생 접속 주소: <a href="${SITE}?room=${T.code}" target="_blank">${SITE}?room=${T.code}</a></p></details>
 ${h.length?`<details class="card"><summary>라운드 기록</summary><table><tr><th>R</th><th>사건</th>${CO.map(c=>`<th>${c}<br>사건 / 반 → 가격</th>`).join('')}<th>주문</th></tr>${h.map((x,k)=>`<tr><td>R${k+1}</td><td>${esc(x.title)}</td>${x.after.map((a,i)=>`<td class="n">${x.e[i]}% / ${x.d[i]}% → ${fmt(a)}</td>`).join('')}<td class="n">${x.ordered}/${x.players}</td></tr>`).join('')}</table></details>`:''}
 ${st.done['97']&&g==='08'?`<details class="card"><summary>1997 게임: 실제와 비교 다시 보기</summary>${chart('97')}</details>`:''}`;
 return top+ctl+body}

function L(l,v){return `<p><b>${l}</b><br>${esc(v).replace(/\n/g,'<br>')}</p>`}
function repTab(){const subs=[...D.submissions].sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="card"><h2>제출물 (${subs.length}/${D.players.length})</h2><div class="row"><button class="ghost" onclick="csv()">AI 대화 링크 목록 CSV 받기</button></div>
 <table style="margin-top:12px"><tr><th>학번 이름</th><th>제출 시각</th><th>AI 대화 기록 링크</th></tr>${subs.map(s=>`<tr><td>${esc(s.name)}</td><td>${new Date(s.ts).toLocaleString('ko-KR')}</td><td>${(s.report.ai?.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.tool||'링크')}</a>`).join(' · ')||'<span class="no">없음</span>'}</td></tr>`).join('')}</table>
 ${subs.map(s=>{const r=s.report;return `<details><summary>${esc(s.name)} · 보고서 펼치기</summary><div class="rep">
  <h4>내 자료</h4>${L('주제',r.topic)}${L('슬라이드에서 고친 것',r.fix?.after)}${L('위기 신호',r.fix?.evidence)}
  <h4>게임 판단 기록</h4><table><tr><th>R</th><th>보유</th><th>근거</th><th>새 정보 → 기업 영향 → 선택</th></tr>${(r.logs||[]).map(l=>`<tr><td>${l.game} R${l.round+1}</td><td>${(l.q||[]).join(' / ')}</td><td>${esc(l.ind)}</td><td>${esc(l.info)} → ${esc(l.impact)} → ${esc(l.why)}</td></tr>`).join('')}</table>
  ${['97','08'].map(g=>`<h4>${g} 게임 후 해석 수정</h4>${L('수정 전',r.reflect?.[g]?.before)}${L('실제와 비교',r.reflect?.[g]?.real)}${L('수정 후',r.reflect?.[g]?.after)}`).join('')}
  <h4>지표 비교 (8)</h4>${L('두 위기',r.compare?.crisis)}${L('한국·태국',r.compare?.country)}${L('근거 위치',r.compare?.where)}
  <h4>구조와 득실 (6)</h4>${L('쟁점',r.issue?.issue)}${L('원인',r.issue?.cause)}${L('대안 A',r.issue?.altA)}${L('대안 B',r.issue?.altB)}${L('결론',r.issue?.choice)}${L('추적 로그 2회차',r.issue?.log2)}
  <h4>AI 검증 (5)</h4>${L('검증 질문',r.ai?.question)}${Object.entries(r.ai?.picks||{}).map(([k,v])=>L(k+' '+(v.v||''),v.fix)).join('')}
  ${(r.ai?.links||[]).map(l=>`<p><b>${esc(l.tool)}</b> <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a><br>${esc(l.what)}</p>`).join('')}</div></details>`}).join('')}</div>`}
function csv(){const rows=[['학번 이름','제출 시각','AI 도구','링크','검증 내용']];D.submissions.forEach(s=>(s.report.ai?.links||[{}]).forEach(l=>rows.push([s.name,new Date(s.ts).toLocaleString('ko-KR'),l.tool||'',l.url||'',l.what||''])));
 const t='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=`AI대화기록_방${T.code}.csv`;a.click()}

function draw(){$('#code').textContent=T.code;const open=[...document.querySelectorAll('details[open]')].map(d=>d.querySelector('summary').textContent);
 $('#app').innerHTML=`<div class="tabs"><button class="${tab==='game'?'on':''}" onclick="tab='game';lastKey='';draw()">게임 진행</button><button class="${tab==='rep'?'on':''}" onclick="tab='rep';lastKey='';draw()">제출물·AI 대화 기록</button></div>`+(tab==='game'?gameTab():repTab());
 document.querySelectorAll('details').forEach(d=>{if(open.includes(d.querySelector('summary').textContent))d.open=true});countUp();tick()}
function start(){load();setInterval(load,2500)}
T.code&&T.pin?start():setup();
</script>
</body>
</html>
