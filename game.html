<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="두 번의 위기">
<title>두 번의 위기 · 내 통계로 투자하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== 토큰: 수업 안내 슬라이드·첫 화면과 동일 ===== */
:root{--paper:#f4efe4;--sheet:#fffdf7;--ink:#16130f;--ink2:#4a4339;--rule:#cfc4ae;--red:#d6281b;--board:#0f1411;--led:#ffb020;--up:#53d18f;--down:#ff5a4e;--ok:#1f7a4d;
--display:'Black Han Sans',sans-serif;--body:'IBM Plex Sans KR',sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--ink);line-height:1.6;background:var(--paper);
 background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 2px,transparent 2px 5px)}
/* 머리기사 */
header{max-width:1040px;margin:0 auto;padding:22px 20px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:5px double var(--ink);padding-bottom:12px}
header h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
header .sub{font-size:13px;color:var(--ink2);margin-top:4px}
header .row{gap:10px}
#who{font-family:var(--mono);font-size:13px;color:var(--ink2)}
#resetBtn{background:transparent!important;color:var(--ink2)!important;border:1px solid var(--rule)!important;box-shadow:none!important;font-size:13px;padding:6px 10px}
/* 단계 표시: 지면 목차 */
nav.steps{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:2px 0;border-bottom:1px solid var(--rule)}
nav.steps span{font-size:13px;padding:4px 12px;color:#8a8070;border-right:1px solid var(--rule)}
nav.steps span:last-child{border-right:0}
nav.steps span.done{color:var(--ink2)}
nav.steps span.done::before{content:'✓ ';color:var(--ok)}
nav.steps span.on{color:var(--paper);background:var(--ink);font-weight:700}
main{max-width:1040px;margin:0 auto;padding:22px 20px 70px}
/* 지면 블록 */
.card{background:var(--sheet);border:2px solid var(--ink);padding:22px 24px;margin-bottom:22px;box-shadow:6px 6px 0 var(--ink)}
h2{margin:0 0 12px;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.15}
h3{margin:18px 0 8px;font-family:var(--display);font-weight:400;font-size:22px}
p{margin:0 0 10px}
.muted{color:var(--ink2);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.co{border:1px solid var(--rule);padding:12px 14px;background:var(--paper)}
.co b{font-size:16px}
/* 시세판: 이 게임의 단 하나의 강조 */
.board{background:var(--board);color:var(--led);display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);margin:16px 0 6px}
.tile{padding:16px 18px;border-right:1px solid #2a302b}
.tile:last-child{border-right:0}
.tile .nm{font-size:14px;color:#cfc8b8}
.tile .nm b{color:var(--paper)}
.price{font-family:var(--mono);font-weight:700;font-size:46px;line-height:1.05;color:var(--led);margin:6px 0 2px;animation:flip .5s ease-out}
.price small{font-size:15px;color:#b9b2a2;margin-left:4px}
.tile .chg{font-family:var(--mono);font-size:17px;font-weight:700}
.tile .hold{font-size:13px;color:#b9b2a2;margin-top:4px}
.board .up{color:var(--up)}.board .down{color:var(--down)}
.up{color:var(--ok);font-weight:700}.down{color:var(--red);font-weight:700}
@keyframes flip{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
/* 장부 숫자 */
.stat{display:flex;flex-wrap:wrap;gap:0;margin:10px 0 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.stat div{padding:10px 18px 10px 0;margin-right:18px;font-size:14px;color:var(--ink2)}
.stat b{font-family:var(--mono);font-size:20px;color:var(--ink);margin-left:6px}
/* 기사(뉴스) */
.news{border-top:3px solid var(--ink);padding:12px 0 4px;margin:0;font-size:17px;line-height:1.65}
.news+.news{border-top:1px solid var(--rule)}
.news::before{content:'지금 상황';display:inline-block;font-family:var(--display);color:var(--red);font-size:15px;margin-right:10px}
.news+.news::before{content:none}
.tip{border-left:8px solid var(--red);background:var(--sheet);padding:12px 16px;margin:14px 0;font-size:15px;outline:1px solid var(--rule)}
.warn{border:2px dashed var(--red);padding:10px 14px;margin:14px 0;font-size:14px;color:var(--red);background:transparent}
.err{color:var(--red);font-weight:700;margin-top:10px}
/* 입력 */
label{display:block;font-weight:700;margin:14px 0 4px;font-size:15px}
textarea,input,select{font:inherit;font-size:15px;width:100%;border:1.5px solid var(--ink);border-radius:0;padding:9px 10px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input[type=number]{text-align:right;font-family:var(--mono)}
textarea:focus,input:focus,select:focus{outline:3px solid var(--led);outline-offset:0}
/* 버튼 */
button{font:inherit;font-weight:700;font-size:16px;border:2px solid var(--ink);border-radius:0;background:var(--ink);color:var(--paper);padding:11px 20px;cursor:pointer;box-shadow:4px 4px 0 var(--red);transition:transform .08s,box-shadow .08s}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--red)}
button:focus-visible{outline:3px solid var(--led);outline-offset:2px}
button.ghost{background:var(--sheet);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:18px}
/* 표 */
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0;background:var(--sheet)}
th,td{border:1px solid var(--ink);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--ink);color:var(--paper);font-weight:500}
td.n{text-align:right;white-space:nowrap;font-family:var(--mono)}
.pt{display:inline-block;background:#1f4fa0;color:#fff;border-radius:3px;font-family:var(--body);font-size:12px;font-weight:700;padding:2px 8px;margin-left:8px;vertical-align:middle;letter-spacing:0}.pt i{font-style:normal;font-weight:400;margin-left:6px;color:#dce6f7}
.badge.sc{border-color:#1f4fa0;color:#1f4fa0;font-weight:700}
.chk{border:2px solid var(--ink);padding:12px 16px 4px;margin:14px 0;background:#fffdf7}.chk-h{font-weight:800;margin-bottom:2px}.ex{margin:8px 0 6px}.ex summary{cursor:pointer;font-weight:700}.ex th{width:150px;text-align:left}
.sct{margin:10px 0 4px}.sct summary{cursor:pointer;font-weight:700}.sct table{margin-top:8px}.sct td.n{text-align:center;font-weight:800;color:#1f4fa0}.sct summary{color:#1f4fa0}
.badge{display:inline-block;font-family:var(--body);font-size:12px;border:1px solid var(--ink2);padding:1px 8px;margin-left:8px;color:var(--ink2);vertical-align:middle;font-weight:500}
/* ECOS 주제 고르기 */
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0;border-top:2px solid var(--ink);border-left:1px solid var(--rule)}
.topic{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--sheet);color:var(--ink);text-align:left;font-weight:400;font-size:14px;padding:12px 14px;box-shadow:none}
.topic:active{transform:none;box-shadow:none}
.topic b{display:block;font-size:16px;margin-bottom:2px}
.topic:hover{background:var(--paper)}
.topic.sel{background:var(--ink);color:var(--paper)}
.log{font-size:14px;border-top:1px solid var(--rule);padding:10px 0;margin:0}
.log b{font-family:var(--mono)}
.flow{padding-left:22px}.flow li{margin:4px 0}
.co img{display:block;width:calc(100% + 28px);margin:-12px -14px 10px;height:150px;object-fit:cover;border-bottom:1px solid var(--rule)}
.media{display:grid;gap:14px;margin:14px 0 4px}
.media.m2{grid-template-columns:1fr 1fr}
.media figure{margin:0}
.media figure>img{display:block;width:100%;height:260px;object-fit:cover;border:2px solid var(--ink);filter:saturate(.92)}
.media.m1 figure>img{height:300px}
.media figcaption{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.45}
.vbox{position:relative;aspect-ratio:16/9;background:var(--board);border:2px solid var(--ink);cursor:pointer;overflow:hidden}
.media.m2 .vbox{aspect-ratio:auto;height:260px}
.vbox img{width:100%;height:100%;object-fit:cover;opacity:.85;display:block}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbox .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:var(--red);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;padding-left:5px}
.vbox:hover .play{transform:translate(-50%,-50%) scale(1.06)}
.sr{position:absolute;left:-9999px}
.media.m1 .vbox,.media.m1 figure>img{max-width:760px}
@media(max-width:700px){.media.m2{grid-template-columns:1fr}}
#print{display:none}
@media(max-width:700px){.board{grid-template-columns:1fr 1fr}.tile:nth-child(2){border-right:0}.tile:nth-child(-n+2){border-bottom:1px solid #2a302b}.price{font-size:36px}header h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 태블릿·터치 */
button,a,.chip,.topic,summary{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
@media (any-pointer:coarse){input:not([type=number]),textarea,select{font-size:16px!important}button{min-height:44px}.chip{min-height:48px}summary{padding:6px 0}}
.tabnote{border:2px dashed var(--ink2);background:var(--sheet);padding:12px 16px;margin:12px 0;font-size:15px}.tabnote b{color:var(--ink)}
@media print{header,nav,main,.noprint{display:none!important}#print{display:block;padding:0 10px;font-size:11pt}body{background:#fff}}

/* ===== 실시간 라운드제 추가 스타일 ===== */
.topic .tn{display:block;font-family:var(--display);font-size:32px;line-height:1.1;margin-bottom:8px}
.topic.none .tn{font-family:var(--body);font-size:15px;font-weight:700;color:var(--ink2)}
.topic b{font-size:15px!important;margin:0!important}
.topic .tq{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.topic.sel .tq,.topic.sel.none .tn{color:#cfc8b8}
.live{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;background:var(--board);color:var(--paper);padding:12px 18px;margin:0 0 18px;border:2px solid var(--ink)}
.live b{color:var(--led);font-family:var(--mono)}
.live .ph{font-weight:700;padding:3px 10px;border:1px solid #556}
.live .ph.open{background:var(--red);border-color:var(--red);color:#fff}
.live .ph.closed{background:var(--led);color:var(--ink);border-color:var(--led)}
.wait{border:2px dashed var(--ink2);padding:26px;text-align:center;font-size:17px;color:var(--ink2);background:transparent}
.bd td.e{color:var(--ink2)} .bd td.pos{color:var(--ok);font-weight:700} .bd td.neg{color:var(--red);font-weight:700}
.chart{width:100%;height:auto;background:var(--sheet);border:2px solid var(--ink)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:8px 0}
.legend i{display:inline-block;width:26px;height:4px;vertical-align:middle;margin-right:6px}
.slidebox{border:2px solid var(--ink);background:#fff}
.slidebox iframe{display:block;width:100%;height:560px;border:0}
.done-badge{display:inline-block;background:var(--ok);color:#fff;font-weight:700;padding:2px 10px;font-size:14px}
.linkrow{display:grid;grid-template-columns:150px 1fr;gap:8px;margin:8px 0}
.howto{font-size:14px;background:var(--paper);border:1px solid var(--rule);padding:10px 14px;margin:8px 0}
.howto li{margin:2px 0}
@media(max-width:700px){.slidebox iframe{height:380px}.linkrow{grid-template-columns:1fr}}

/* ===== 가독성·모션 (라운드 화면) ===== */
.live{position:sticky;top:0;z-index:20;font-size:16px}
.live .rd{font-family:var(--display);font-size:26px;color:var(--led)}.live .rd small{font-size:15px;color:#b9b2a2;margin-left:2px}
.live .me{margin-left:auto}.live .me em{font-style:normal;font-family:var(--mono);margin-left:6px}
.live .up{color:#53d18f}.live .down{color:#ff7a6e}
.timer{display:inline-flex;align-items:center;gap:10px}.timer b{font-family:var(--mono);font-size:26px;color:#fff}.timer i{display:block;width:120px;height:8px;background:#2a302b}.timer u{display:block;height:100%;background:var(--led);transition:width .5s linear}
.timer.low b{color:#ff5a4e;animation:blink 1s steps(2) infinite}.timer.low u{background:#ff5a4e}
@keyframes blink{50%{opacity:.35}}
.wait .big{font-family:var(--display);font-size:72px;color:var(--ink);line-height:1;margin-bottom:10px}
.event{border-width:3px}
.evhead{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.stamp2{font-family:var(--display);color:#fff;background:var(--red);padding:4px 14px;font-size:20px;transform:rotate(-3deg)}
.evdate{font-family:var(--mono);font-weight:700;font-size:34px;color:var(--red);letter-spacing:.04em}
.evt{font-size:40px!important;margin:4px 0 12px!important}
.evnews{list-style:none;margin:0 0 6px;padding:0}
.evnews li{font-size:19px;line-height:1.6;padding:10px 0 10px 26px;border-top:1px solid var(--rule);position:relative}
.evnews li::before{content:'';position:absolute;left:4px;top:21px;width:10px;height:10px;background:var(--red)}
.event.fresh .stamp2{animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) both}
.event.fresh .evdate,.event.fresh .evt{animation:slideIn .6s ease-out both}
.event.fresh .evnews li{animation:fadeUp .6s ease-out both}
@keyframes stampIn{from{transform:scale(2.4) rotate(-12deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.board .unit{font-size:13px;color:#b9b2a2;margin-top:-4px}
.price{animation:none!important}
.tile.fu{animation:flashU 1.6s ease-out .3s}.tile.fd{animation:flashD 1.6s ease-out .3s}
@keyframes flashU{0%,100%{background:transparent}25%{background:rgba(83,209,143,.28)}}
@keyframes flashD{0%,100%{background:transparent}25%{background:rgba(255,90,78,.3)}}
.bars{margin:8px 0}
.bh,.br{display:grid;grid-template-columns:150px 1fr 1fr 190px;gap:14px;align-items:center}
.bh{font-size:13px;color:var(--ink2);padding-bottom:4px;border-bottom:2px solid var(--ink)}
.br{padding:10px 0;border-bottom:1px solid var(--rule)}.br b{font-size:15px}
.bw{position:relative;height:28px;background:linear-gradient(90deg,transparent calc(50% - 1px),#16130f calc(50% - 1px),#16130f calc(50% + 1px),transparent calc(50% + 1px)),#f1ebdf}
.bw .b{position:absolute;top:4px;height:20px;width:0;animation:grow .9s ease-out .4s forwards}
.bw .b.p{left:50%}.bw .b.n{right:50%}
@keyframes grow{to{width:var(--w)}}
.bw em{position:absolute;top:4px;font-style:normal;font-family:var(--mono);font-size:13px;font-weight:700;left:4px}
.br strong{font-family:var(--mono);font-size:22px}.br strong small{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.chart.draw .ln{stroke-dashoffset:1;animation:drawLn 2.2s ease-in-out forwards}
.chart.draw polyline.ln[stroke-dasharray]{stroke-dashoffset:0;animation:fadeIn 1.6s ease-out both}
@keyframes drawLn{from{stroke-dasharray:1 1;stroke-dashoffset:1}to{stroke-dasharray:1 1;stroke-dashoffset:0}}
.chart.draw .dt,.chart.draw .lb{opacity:0;animation:fadeIn .5s ease-out forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qi{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:center;border:1.5px solid var(--ink);padding:8px;background:#fff;margin:0;font-weight:700}
.qi img{grid-row:1/3;width:52px;height:52px;object-fit:cover}
.qi span{font-size:14px}.qi small{display:block;font-family:var(--mono);color:var(--red);font-weight:700}
.qi input{font-size:20px;padding:6px 8px}
.calc{font-size:15px;margin:10px 0;padding:8px 12px;background:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
details.card summary{cursor:pointer;font-weight:700;font-size:16px}
@media(max-width:800px){.qgrid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.bh,.br{grid-template-columns:90px 1fr 1fr;}.br strong{grid-column:1/-1}.evt{font-size:28px!important}.live .me{margin-left:0}}
@media(prefers-reduced-motion:reduce){.chart.draw .ln{stroke-dasharray:none!important;animation:none}.chart.draw .dt,.chart.draw .lb{opacity:1}.bw .b{width:var(--w)}}


.evbody.has{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:start}
.evbody .media{margin:0;grid-template-columns:1fr!important}
.evbody .media figure>img,.evbody .media .vbox{height:210px!important;max-width:none!important;width:100%;aspect-ratio:auto}
.evbody .media figcaption{font-size:12px}
@media(max-width:800px){.evbody.has{grid-template-columns:1fr}}

.lockbar{position:sticky;top:0;z-index:50;background:var(--red);color:#fff;font-weight:700;text-align:center;padding:12px}
.pol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.pc{border:1.5px solid var(--ink);background:#fff;padding:12px 14px}.pc .pk{display:inline-block;font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--paper);padding:2px 8px;margin-bottom:6px}
.pc b{display:block;font-size:16px}.pc p{font-size:14px;margin:6px 0}.pc a{font-size:12px;color:#1d4ed8}
@media(max-width:800px){.pol{grid-template-columns:1fr}}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff!important;color:var(--ink)!important;border:2px solid var(--ink)!important;box-shadow:none!important;padding:10px 18px!important;font-size:16px!important}
.chip.on{background:var(--ink)!important;color:var(--led)!important}
#why{font-size:16px}
</style>
</head>
<body>
<header>
  <div><h1>두 번의 위기, 내 통계로 투자하기</h1><div class="sub">국제관계와 국제기구 2학기 개인 수행평가. 수익률은 점수에 들어가지 않습니다.</div></div>
  <div class="row noprint" style="margin-top:0"><span id="who"></span><a href="slides.html#6" target="_blank" rel="noopener"><button class="ghost" type="button">게임·보고서 설명 보기</button></a><button class="ghost" id="resetBtn">기록 지우고 처음부터</button></div>
</header>
<nav class="steps" id="steps"></nav>
<main id="app"></main>
<div id="print"></div>
<script>
'use strict';
const API='https://two-crises-api.histo5731.workers.dev/api';
const KEY='twoCrisisLive_v3';
const START=10000;
const DECK='1OINezkthSnwaWk7U4a6jEteJgv4vh4_hOWZYgslFS_o';
const CO=[

${ta('fix.before','원래 어떻게 썼나 (고칠 부분)','예: 범례가 없어 네 개 선이 무엇인지 알 수 없었다')}

/* ---------- 2·3. 실시간 게임 ---------- */
let LIVE=null,lastKey='',clockOff=0,shown={};
function myWealth(g,p){const G=LIVE?.me?.games?.[g];if(!G)return START;return G.cash+G.q.reduce((s,q,i)=>s+q*p[i],0)}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
/* 비교 그래프: 실제 지수들 + 우리 반, 선이 그려지는 애니메이션 */
function chartSVG(g,st){const R=st.real?.[g];const h=st.history[g];if(!R||!h.length)return '';
 const months=R.kospi.map(r=>r[0]);const mi=d=>months.indexOf(d);
 const norm=s=>{const base=(s.find(r=>r[0]===h[0].date)||s[0])[1];return s.map(([d,v])=>[mi(d),v/base*100])};
 const series=[{n:'실제 코스피',c:'#16130f',w:4,d:'',pts:norm(R.kospi)}];
 if(R.sp500)series.push({n:'실제 S&P 500 (미국)',c:'#1d4ed8',w:3,d:'',pts:norm(R.sp500)});
 series.push({n:'우리 반 주가지수',c:'#d6281b',w:4,d:'10 6',pts:h.map(x=>[mi(x.date),avg(x.after)]),dots:true});
 const all=series.flatMap(s=>s.pts.map(p=>p[1])).concat(100);const lo=Math.floor(Math.min(...all)/10)*10-5,hi=Math.ceil(Math.max(...all)/10)*10+5;
 const W=960,H=420,L=56,Rr=150,T=24,B=58;const X=i=>L+(W-L-Rr)*i/(months.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 let s=`<svg class="chart draw" viewBox="0 0 ${W} ${H}" role="img" aria-label="실제 지수와 우리 반 주가 비교">`;
 for(let v=Math.ceil(lo/20)*20;v<=hi;v+=20)s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e4dbc8"/><text x="${L-8}" y="${Y(v)+4}" font-size="13" text-anchor="end" fill="#4a4339">${v}</text>`;
 s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(100)}" y2="${Y(100)}" stroke="#16130f" stroke-dasharray="3 4"/><text x="${W-Rr+6}" y="${Y(100)+4}" font-size="12" fill="#4a4339">시작=100</text>`;
 months.forEach((m,i)=>{if(i%3===0)s+=`<text x="${X(i)}" y="${H-B+20}" font-size="12" text-anchor="middle" fill="#4a4339">${m.replace('-','.')}</text>`});
 h.forEach((x,k)=>{const i=mi(x.date);s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${H-B}" stroke="#d6281b" stroke-opacity=".18"/><text x="${X(i)}" y="${H-B+40}" font-size="12" font-weight="700" text-anchor="middle" fill="#d6281b">R${k+1}</text>`});
 series.forEach((se,k)=>{const pts=se.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');const last=se.pts.at(-1);
  s+=`<polyline class="ln" style="animation-delay:${k*0.6}s" ${se.d?'':'pathLength="1"'} fill="none" stroke="${se.c}" stroke-width="${se.w}" stroke-linejoin="round" ${se.d?`stroke-dasharray="${se.d}"`:''} points="${pts}"/>`;
  if(se.dots)se.pts.forEach(p=>s+=`<circle class="dt" style="animation-delay:${k*0.6+0.9}s" cx="${X(p[0])}" cy="${Y(p[1])}" r="5" fill="${se.c}"/>`);
  s+=`<text class="lb" style="animation-delay:${k*0.6+1}s" x="${X(last[0])+8}" y="${Y(last[1])+5}" font-size="14" font-weight="700" fill="${se.c}">${se.n.replace(' (미국)','').replace('실제 ','')} ${Math.round(last[1])}</text>`});
 return s+`</svg><div class="legend">${series.map(se=>`<span><i style="background:${se.c}"></i>${se.n}</span>`).join('')}</div><div class="muted">${R.sp500?'세 선':'두 선'} 모두 R1 시점=100으로 맞춘 값. 코스피: Yahoo Finance ^KS11${R.sp500?', S&P 500: ^GSPC':''} 월말 종가.</div>`}
/* 결과: 회사별 막대 (사건 영향 / 우리 반 영향 / 최종 변화) */
function bars(x){const mx=30;const bar=(v,c)=>{const w=Math.min(Math.abs(v),mx)/mx*50;return `<div class="bw"><span class="b ${v>=0?'p':'n'}" style="--w:${w}%;background:${c}"></span><em>${pct(v)}</em></div>`};
 return `<div class="bars"><div class="bh"><span></span><span>사건 영향</span><span>우리 반 매수·매도</span><span>최종 변화</span></div>${CO.map((c,i)=>{const tot=(x.after[i]/x.before[i]-1)*100;return `<div class="br"><b>${c.k} ${c.name}</b>${bar(x.e[i],x.e[i]>=0?'#2fa86b':'#d6281b')}${bar(x.d[i],x.d[i]>=0?'#53d18f':'#ff7a6e')}<strong class="${tot>=0?'up':'down'}">${tot>=0?'▲':'▼'} ${pct(tot)}<small>${fmt(x.before[i])} → ${fmt(x.after[i])}</small></strong></div>`}).join('')}</div>
 <div class="muted">산 사람/판 사람: ${CO.map((c,i)=>`${c.k} ${x.buyers[i]}/${x.sellers[i]}`).join(' · ')} · 주문 ${x.ordered}/${x.players}명 · 우리 반 영향 = 그 회사로 몰린 돈 비중 × 0.4 (최대 ±15%)</div>`}
function board(g,p,prev){return `<div class="board">${CO.map((c,i)=>{const ch=prev?(p[i]/prev[i]-1)*100:0;return `<div class="tile ${prev?(ch>=0?'fu':'fd'):''}"><div class="nm"><b>${c.k} ${c.name}</b> ${c.type}</div><div class="price" data-from="${prev?prev[i]:p[i]}" data-to="${p[i]}">${fmt(prev?prev[i]:p[i])}</div><div class="unit">만원</div>${prev?`<div class="chg ${ch>=0?'up':'down'}">${ch>=0?'▲ +':'▼ '}${fmt(ch)}%</div>`:'<div class="chg" style="color:#b9b2a2">현재가</div>'}<div class="hold">내 보유 ${LIVE?.me?.games?.[g]?.q?.[i]??0}주</div></div>`}).join('')}</div>`}
function countUp(){document.querySelectorAll('.price[data-from]').forEach(el=>{const a=+el.dataset.from,b=+el.dataset.to;if(a===b||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=fmt(b);return}const t0=performance.now(),D=1400;const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=fmt(a+(b-a)*e);if(k<1)requestAnimationFrame(step)};setTimeout(()=>requestAnimationFrame(step),350)})}
function timerHTML(st){return st.phase==='open'?`<span class="timer"><b id="tm">--:--</b><i><u id="tmbar"></u></i></span>`:''}
function tickTimer(){const st=LIVE?.state;const el=document.getElementById('tm');if(!st||!el||st.phase!=='open'||!st.openedAt)return;const left=Math.max(0,st.limit*1000-((Date.now()+clockOff)-st.openedAt));const s=Math.ceil(left/1000);el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;const bar=document.getElementById('tmbar');if(bar)bar.style.width=(left/(st.limit*1000)*100)+'%';el.parentElement.classList.toggle('low',s<=30);
 const ck=st.game+'|'+st.round;if(ck!==tmK){tmK=ck;tmS=s}else if(s!==tmS){tmS=s;if(s===30)sfx('warn');else if(s<=10&&s>3)sfx('tick');else if(s<=3&&s>=1)sfx('beep');else if(s===0)sfx('end')}}
let tmK='',tmS=-1;
setInterval(tickTimer,500);
let g_='97';
function gameView(g){g_=g;
 if(!S.pid)return `<div class="card wait">먼저 시작 화면에서 입장하세요.</div>`;
 if(!LIVE)return `<div class="card wait">선생님 서버에 연결하는 중…</div>`;
 const st=LIVE.state;const h=st.history[g];const ev=st.events[g];const isCur=st.game===g;const over=st.done[g];
 if(!isCur&&!over)return `<div class="card wait">${g==='08'?'1997 게임이 끝나면 선생님이 2008 게임을 시작합니다.':'아직 시작 전입니다.'}</div>`;
 const p=st.prices[g];const last=h.at(-1);const phase=over&&!isCur?'over':st.phase;const curEv=phase==='ready'||phase==='over'?null:ev.at(-1);
 const G=LIVE.me?.games?.[g]||{cash:START,q:[0,0,0,0]};const w=myWealth(g,p);const NR=st.rounds||4;const rn=Math.min(st.round+1,NR);
 let html=`<div class="live"><span class="rd">${g==='97'?'1997':'2008'} · R${rn}<small>/${NR}</small></span><span class="ph ${phase}">${{ready:'다음 라운드 대기',open:'주문 받는 중',closed:'라운드 결과',over:'게임 종료'}[phase]}</span>${timerHTML({...st,phase})}${phase==='open'?`<span>제출 <b id="cnt">${LIVE.ordered}/${LIVE.players}</b></span>`:''}<span class="me">내 평가액 <b>${fmt(w)}</b>만원 <em class="${w>=START?'up':'down'}">${pct((w/START-1)*100)}</em></span></div>`;
 if(phase==='ready')html+=`<div class="card wait"><div class="big">R${rn}</div>${h.length?'지난 라운드 결과를 돌아보세요. ':''}선생님이 라운드를 열면 새 사건이 공개됩니다.</div>`;
 let evH='';if(curEv)evH=`<div class="card event ${phase==='open'?'fresh':''}"><div class="evhead"><span class="stamp2">속보</span><span class="evdate">${curEv.date.replace('-','.')}</span></div><h2 class="evt">${esc(curEv.title.split('·').slice(1).join('·').trim()||curEv.title)}</h2><div class="evbody ${curEv.media?.length?'has':''}"><ul class="evnews">${curEv.news.map((n,i)=>`<li style="animation-delay:${.25+i*.35}s">${n}</li>`).join('')}</ul>${mediaHTML(curEv.media)}</div></div>`;
 if(phase!=='closed')html+=evH;
 if(phase!=='over')html+=`<div class="card"><h3>${phase==='closed'?'이번 라운드 주가 변화':'현재 주가'}</h3>${board(g,p,phase==='closed'?last?.before:null)}${phase==='closed'&&last?`<h3>왜 바뀌었나</h3>${bars(last)}`:''}</div>`;
 if(phase==='closed')html+=evH.replace('card event','card event done');

 if(phase==='over')html+=overView(g,st);
 html+=`<details class="card"><summary>지난 라운드 · 내 판단 기록 · 공통 지표</summary>
 ${h.map((x,k)=>`<div class="log"><b>R${k+1}</b> ${esc(x.title)} · 평균 주가 ${fmt(avg(x.after))}</div>`).join('')||'<div class="muted">아직 없음</div>'}
 <h3>내 판단 기록</h3>${S.logs.filter(l=>l.game===g).map(l=>`<div class="log"><b>R${l.round+1}</b> ${l.q.map((q,i)=>CO[i].k+' '+q+'주').join(', ')} · 근거: ${esc(l.ind)}${l.why?'<br>메모: '+esc(l.why):''}</div>`).join('')||'<div class="muted">아직 없음</div>'}
 ${ev.length?`<h3>공통 지표 (지금까지 공개된 연도)</h3>${indTable(+ev.at(-1).date.slice(0,4),g==='97'?1996:2007)}`:''}</details>`;
 return html}
function orderForm(g,p,w,r){const dk=g+'-'+r;const d=S.drafts[dk]||{};const mine=LIVE.me?.order;const G=LIVE.me?.games?.[g]||{q:[0,0,0,0]};

 const opts=[[TOPICS[S.topic]?.t?TOPICS[S.topic].t+' (내 ECOS 주제)':'내 ECOS 주제','내 통계'],['공통지표① 환율','환율'],['공통지표② 대출금리','금리'],['공통지표③ 실질 GDP 성장률','성장률'],['오늘 사건 뉴스','뉴스']];
 return `<div class="card order"><h3>${first?'첫 주문':'이번 라운드 주문'} ${mine?'<span class="done-badge">제출됨 · 마감 전까지 수정 가능</span>':''}</h3>
 ${first?ta('strategy.basis','내 전략 한 줄','예: 단기외채가 늘었으니 은행·건설은 피하고 수출기업 위주로, 현금은 절반'):''}
 <label>목표 보유 주식 수</label>
 <div class="qgrid">${CO.map((c,i)=>`<label class="qi"><img src="${c.img}" alt=""><span>${c.k} ${c.name}<small>${fmt(p[i])}만원</small></span><input type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" onfocus="this.select()" id="q${i}" value="${q[i]}"></label>`).join('')}</div>

 <label>한 줄 메모 <span class="muted">(선택 · 나중에 「수정 전 해석」 쓸 때 도움이 됩니다)</span></label><input id="why" maxlength="200" value="${esc(d.why??mine?.note?.why??'')}" placeholder="예: 만기 연장 거부 → 은행 위험, 전부 판다">

function reflectBlock(g){return `<div class="tip"><b>여기가 채점되는 부분입니다. 비교·수정 6점 중 ${g==='97'?'1997':'2008'} 게임 ${pt(2)}</b> 세 칸을 이어서 「수정 전 → 실제와 비교 → 수정 후」가 드러나야 합니다. 라운드마다 고른 근거와 메모는 「지난 라운드 · 내 판단 기록」에서 다시 볼 수 있습니다.</div>

function overView(g,st){
